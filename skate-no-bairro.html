<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛹 Skate no Bairro — Jogo Modelo (Aula 5)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --ink:#1c1230; --gold:#ffd23f; --hot:#ff4d6d; }
  html,body {
    width:100%; height:100%;
    background: linear-gradient(180deg, #ff9a5a, #ffd08a);
    display:flex; align-items:center; justify-content:center;
    font-family:'Press Start 2P', monospace;
    overflow:hidden;
  }
  #wrap { position:relative; width:900px; max-width:96vw; filter:drop-shadow(0 10px 0 rgba(0,0,0,.3)); }
  #hud {
    position:absolute; top:0; left:0; right:0; z-index:5; pointer-events:none;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 18px; font-size:13px; letter-spacing:1px;
    background:linear-gradient(180deg, rgba(20,10,40,.85), rgba(20,10,40,0));
  }
  #hud .stat { color:#fff; text-shadow:2px 2px 0 #000; white-space:nowrap; }
  #hud .stat b { color:var(--gold); font-size:15px; }
  #progress { flex:1; max-width:320px; height:16px; background:rgba(0,0,0,.45); border:2px solid #fff; border-radius:999px; position:relative; }
  #progressFill { height:100%; width:0%; background:linear-gradient(90deg,#00e5a0,#ffe033); border-radius:999px; }
  #progressIcon { position:absolute; top:-7px; left:0%; font-size:18px; transform:translateX(-50%); }
  canvas { display:block; width:100%; height:auto; background:#66c5ff; border:6px solid var(--ink); border-radius:8px; box-shadow:0 0 0 3px #fff, 0 14px 0 rgba(0,0,0,.35); }
  #hint {
    position:absolute; bottom:10px; left:0; right:0; text-align:center; color:#fff; font-size:13px; font-weight:bold;
    font-family:-apple-system, Segoe UI, Arial, sans-serif; text-shadow:2px 2px 0 #000; pointer-events:none; z-index:5;
  }
  #overlay {
    position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px;
    background:rgba(20,10,40,.85); border-radius:8px; z-index:10; text-align:center; padding:20px;
  }
  #overlay.show { display:flex; }
  #overlay h2 { font-size:22px; color:var(--gold); text-shadow:3px 3px 0 #000; letter-spacing:2px; }
  #overlay p { color:#fff; font-size:12px; max-width:480px; line-height:2; text-shadow:2px 2px 0 #000; }
  #overlay button {
    margin-top:6px; padding:14px 26px; font-size:12px; font-family:'Press Start 2P', monospace;
    background:var(--hot); color:#fff; border:3px solid #fff; border-radius:6px; cursor:pointer; letter-spacing:1px;
    box-shadow:0 5px 0 #8f1d38;
  }
  #overlay button:active { box-shadow:0 2px 0 #8f1d38; transform:translateY(3px); }
</style>
</head>
<body>

<div id="wrap">
  <div id="hud">
    <div class="stat" id="heartsVal">❤️❤️❤️</div>
    <div class="stat">🪙 <b id="coinVal">0</b></div>
    <div id="progress"><div id="progressFill"></div><div id="progressIcon">🛹</div></div>
    <div class="stat">🏁 <b id="pctVal">0</b>%</div>
  </div>

  <canvas id="game" width="900" height="500"></canvas>

  <div id="hint">← → trocar de pista · ↑ ou ESPAÇO pular · viu o alvo ⚠️ no chão? corre pra outra pista!</div>

  <div id="overlay">
    <h2 id="overlayTitle">🏁 CHEGOU!</h2>
    <p id="overlayText">Você chegou ao fim da rua!</p>
    <button onclick="restart()">🔄 JOGAR DE NOVO</button>
  </div>
</div>

<script>
/* =========================================================
   SKATE NO BAIRRO — jogo modelo da Aula 5 (corredor de 3
   pistas, visto de trás). Skatista, controle, moedas,
   obstáculos de pista, meteoro que cai do céu (com aviso)
   e objetivo (chegar ao fim da rua) já funcionam, mas
   ainda não tem perseguidor nem níveis — isso a turma
   constrói nas próximas missões, sempre em cima deste
   código.
   ========================================================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- Mundo ----------
const HORIZON = 165;          // altura (y) do horizonte
const BASE_Y = 430;           // altura (y) do chão onde o skatista aparece
const LANE_W = 190;           // largura de cada pista, perto da câmera
const FOCAL = 9;              // controla a perspectiva (quanto mais longe, menor)
const ROAD_HALF = LANE_W*1.5 + 24;
const SIDEWALK = 120;
const TRACK_LENGTH = 1000;    // metros até a chegada
const START_SPEED = 14;       // metros por segundo
const MAX_D = 95;             // até que distância a gente desenha

let speed = START_SPEED;
let distance = 0;
let time = 0;
let gameOver = false;
let coinCount = 0;

// ---------- Perspectiva ----------
function sc(d) { return FOCAL / (FOCAL + Math.max(d, -FOCAL*0.6)); }
function gy(d) { return HORIZON + (BASE_Y - HORIZON) * sc(d); }
function laneX(l, d) { return W/2 + (l-1) * LANE_W * sc(d); }
function hash(n) { const x = Math.sin(n*127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// ---------- Skatista ----------
const player = { lane: 1, targetLane: 1, jumpY: 0, vy: 0, onGround: true, invincible: false, invincibleTimer: 0 };
const GRAVITY = 2300;
const JUMP_SPEED = 800;
const JUMP_CLEAR_H = 50; // altura mínima pra passar por cima de um cone
const START_LIVES = 3;
const INVINCIBLE_TIME = 1.5; // segundos piscando depois de tomar um golpe
let lives = START_LIVES;

// ---------- Moedas ----------
let coins = [];
function buildCoins() {
  coins = [];
  let n = 0;
  for (let m = 30; m < TRACK_LENGTH - 30; m += 24) {
    const lane = Math.floor(hash(n*3 + 7) * 3);
    for (let i = 0; i < 5; i++) coins.push({ d: m + i*2.4, lane, taken: false });
    n++;
  }
}
buildCoins();

// ---------- Obstáculos ----------
// cone: quase do tamanho do skatista, mas dá pra pular por cima
// caminhao: vermelho, maior que o skatista, ocupa só a própria pista
// e é impossível de passar (nem pulando) — tira 1 coração se bater.
const SPAWN_AHEAD = 92;         // metros à frente de onde o obstáculo nasce
let obstacles = [];
let spawnTimer = 1.5;
function randSpawnGap() { return 1 + Math.random(); } // 1 a 2 segundos

function spawnObstacle() {
  const lane = Math.floor(Math.random() * 3);
  const type = Math.random() < 0.5 ? 'cone' : 'caminhao';
  // como só nasce 1 obstáculo por vez, sempre sobram 2 pistas livres
  // naquela distância — as 3 pistas nunca ficam bloqueadas juntas.
  obstacles.push({ d: distance + SPAWN_AHEAD, lane, type, hit: false });
  obstacles = obstacles.filter(o => o.d - distance > -10);
}

function checaColisao(o) {
  const d = o.d - distance;
  if (d > -1.6 && d < 1.3 && Math.abs(player.lane - o.lane) < 0.55) {
    if (o.type === 'cone' && player.jumpY > JUMP_CLEAR_H) return false; // pulou por cima
    return true;
  }
  return false;
}

// ---------- Meteoro que cai do céu ----------
// Um alvo pisca no CHÃO por 1s (aviso) marcando onde o meteoro vai
// atingir a pista. Pular não adianta: ele vem de cima e o golpe é
// checado direto na pista, sem olhar a altura do pulo — só trocar de
// pista salva. Ao cair, deixa rastro de fogo, sacode a tela e explode
// com onda de choque, fumaça e cratera.
const WARN_TIME = 1;      // segundos de aviso antes do meteoro cair
const FALL_TIME = 0.42;   // segundos caindo até o chão
const SPLAT_TIME = 0.7;   // segundos da explosão no chão, antes de sumir
const SHAKE_TIME = 0.25;  // segundos de tremida de tela no impacto
const FLASH_TIME = 0.12;  // segundos do flash de luz no impacto
let fallEvents = [];
let fallSpawnTimer = randFallGap();
let shakeTimer = 0;
let flashTimer = 0;
function randFallGap() { return 4 + Math.random() * 3; } // 4 a 7 segundos

function update_fallEvents(dt) {
  if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - dt);
  if (flashTimer > 0) flashTimer = Math.max(0, flashTimer - dt);

  fallSpawnTimer -= dt;
  if (fallSpawnTimer <= 0) {
    fallEvents.push({ lane: Math.floor(Math.random() * 3), state: 'aviso', timer: WARN_TIME });
    fallSpawnTimer = randFallGap();
  }
  for (const f of fallEvents) {
    f.timer -= dt;
    if (f.state === 'aviso' && f.timer <= 0) {
      f.state = 'caindo';
      f.timer = FALL_TIME;
    } else if (f.state === 'caindo' && f.timer <= 0) {
      if (!player.invincible && Math.abs(player.lane - f.lane) < 0.55) loseLife('meteoro');
      f.state = 'estrago';
      f.timer = SPLAT_TIME;
      shakeTimer = SHAKE_TIME;
      flashTimer = FLASH_TIME;
    } else if (f.state === 'estrago' && f.timer <= 0) {
      f.done = true;
    }
  }
  fallEvents = fallEvents.filter(f => !f.done);
}

// ---------- Controle ----------
const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (keys[e.code]) return;
  keys[e.code] = true;
  if (e.code === 'ArrowLeft')  player.targetLane = Math.max(0, player.targetLane - 1);
  if (e.code === 'ArrowRight') player.targetLane = Math.min(2, player.targetLane + 1);
  if (e.code === 'ArrowUp' || e.code === 'Space') tryJump();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function tryJump() {
  if (player.onGround) { player.vy = JUMP_SPEED; player.onGround = false; }
}

// ---------- Atualização ----------
function update(dt) {
  if (gameOver) return;
  time += dt;
  distance += speed * dt;

  player.lane += (player.targetLane - player.lane) * Math.min(1, dt * 14);

  if (!player.onGround) {
    player.vy -= GRAVITY * dt;
    player.jumpY += player.vy * dt;
    if (player.jumpY <= 0) { player.jumpY = 0; player.vy = 0; player.onGround = true; }
  }

  if (player.invincible) {
    player.invincibleTimer -= dt;
    if (player.invincibleTimer <= 0) { player.invincible = false; player.invincibleTimer = 0; }
  }

  for (const c of coins) {
    if (c.taken) continue;
    const d = c.d - distance;
    if (d < 1.2 && d > -1.5 && Math.abs(player.lane - c.lane) < 0.6) {
      c.taken = true;
      coinCount++;
      document.getElementById('coinVal').textContent = coinCount;
    }
  }

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnObstacle();
    spawnTimer = randSpawnGap();
  }
  for (const o of obstacles) {
    if (o.hit) continue;
    if (checaColisao(o)) {
      o.hit = true;
      if (!player.invincible) loseLife(o.type);
      break;
    }
  }
  if (gameOver) return;

  update_fallEvents(dt);
  if (gameOver) return;

  const pct = Math.min(100, distance / TRACK_LENGTH * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressIcon').style.left = pct + '%';
  document.getElementById('pctVal').textContent = Math.floor(pct);
  if (distance >= TRACK_LENGTH) winGame();
}

function winGame() {
  gameOver = true;
  const title = document.getElementById('overlayTitle');
  title.textContent = '🏁 CHEGOU!';
  title.style.color = 'var(--gold)';
  title.style.textShadow = '3px 3px 0 #000';
  document.getElementById('overlayText').textContent = `Você chegou ao fim da rua com ${coinCount} moedas!`;
  document.getElementById('overlay').classList.add('show');
}

function updateHearts() {
  document.getElementById('heartsVal').textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(START_LIVES - Math.max(0, lives));
}

function loseLife(type) {
  lives--;
  updateHearts();
  if (lives <= 0) {
    crashGame(type);
  } else {
    player.invincible = true;
    player.invincibleTimer = INVINCIBLE_TIME;
  }
}

function crashGame(type) {
  gameOver = true;
  const title = document.getElementById('overlayTitle');
  title.textContent = 'GAME OVER';
  title.style.color = '#ff1a1a';
  title.style.textShadow = '3px 3px 0 #000, 0 0 16px #ff1a1a';
  document.getElementById('overlayText').textContent = type === 'caminhao'
    ? `Você bateu no caminhão! Moedas: ${coinCount}`
    : type === 'meteoro'
    ? `Um meteoro caiu bem em cima de você! Moedas: ${coinCount}`
    : `Você bateu num cone! Moedas: ${coinCount}`;
  document.getElementById('overlay').classList.add('show');
}

function restart() {
  speed = START_SPEED;
  distance = 0; time = 0;
  coinCount = 0;
  gameOver = false;
  lives = START_LIVES;
  updateHearts();
  player.lane = player.targetLane = 1;
  player.jumpY = 0; player.vy = 0; player.onGround = true;
  player.invincible = false; player.invincibleTimer = 0;
  buildCoins();
  obstacles = [];
  spawnTimer = randSpawnGap();
  fallEvents = [];
  fallSpawnTimer = randFallGap();
  document.getElementById('coinVal').textContent = 0;
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressIcon').style.left = '0%';
  document.getElementById('pctVal').textContent = 0;
  document.getElementById('overlay').classList.remove('show');
}

// ---------- Desenho: utilidades ----------
function poly(pts, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (n >> 16) + amt));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
  const b = Math.max(0, Math.min(255, (n & 255) + amt));
  return `rgb(${r},${g},${b})`;
}

// ---------- Desenho: céu e morro ----------
const HILL_HOUSES = Array.from({length: 70}, (_, i) => ({
  x: i*14 + hash(i)*8, w: 8 + hash(i+50)*9, h: 8 + hash(i+90)*12,
  c: ['#ffb703','#fb8500','#e63946','#8ecae6','#f1faee','#2a9d8f','#e76f51'][Math.floor(hash(i+130)*7)]
}));
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, HORIZON);
  g.addColorStop(0, '#4db8ff'); g.addColorStop(0.7, '#ffd9a0'); g.addColorStop(1, '#ffb97a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HORIZON + 2);
  ctx.fillStyle = '#8f8676'; ctx.fillRect(0, HORIZON, W, H - HORIZON);

  // sol
  const sx = W*0.72, sy = HORIZON - 44;
  const glow = ctx.createRadialGradient(sx, sy, 6, sx, sy, 90);
  glow.addColorStop(0, 'rgba(255,240,180,.95)'); glow.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = glow; ctx.fillRect(sx-90, sy-90, 180, 180);
  ctx.fillStyle = '#fff6c9'; ctx.beginPath(); ctx.arc(sx, sy, 22, 0, Math.PI*2); ctx.fill();

  // nuvens
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (let i = 0; i < 4; i++) {
    const cx = ((i*260 + time*8 + 60) % (W+200)) - 100, cy = 30 + i*22;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 44, 13, 0, 0, Math.PI*2);
    ctx.ellipse(cx-28, cy+4, 26, 10, 0, 0, Math.PI*2);
    ctx.ellipse(cx+30, cy+4, 28, 10, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // morro com casinhas coloridas ao fundo
  ctx.fillStyle = '#6a4c93';
  ctx.beginPath(); ctx.moveTo(0, HORIZON);
  ctx.quadraticCurveTo(W*0.25, HORIZON-70, W*0.5, HORIZON-30);
  ctx.quadraticCurveTo(W*0.78, HORIZON-80, W, HORIZON-22);
  ctx.lineTo(W, HORIZON); ctx.closePath(); ctx.fill();
  for (const h of HILL_HOUSES) {
    const base = HORIZON - 4 - Math.abs(Math.sin(h.x*0.011))*38;
    ctx.fillStyle = h.c; ctx.fillRect(h.x, base - h.h, h.w, h.h);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(h.x, base - h.h, h.w, 2);
  }
}

// ---------- Desenho: rua ----------
function drawRoad() {
  const dNear = -5.4;
  const sN = sc(dNear), yN = gy(dNear);

  // calçadas
  for (const side of [-1, 1]) {
    poly([
      [W/2 + side*ROAD_HALF*sN, yN], [W/2 + side*(ROAD_HALF+SIDEWALK)*sN, yN],
      [W/2 + side*(ROAD_HALF+SIDEWALK)*0.001, HORIZON], [W/2 + side*ROAD_HALF*0.001, HORIZON]
    ], '#c9c2b8');
  }
  // asfalto
  const g = ctx.createLinearGradient(0, HORIZON, 0, H);
  g.addColorStop(0, '#5a5a66'); g.addColorStop(1, '#2f2f3a');
  poly([[W/2 - ROAD_HALF*sN, yN], [W/2 + ROAD_HALF*sN, yN], [W/2, HORIZON], [W/2, HORIZON]], g);

  // faixas tracejadas
  const step = 4, len = 2;
  const start = Math.floor(distance/step)*step;
  for (const lb of [0.5, 1.5]) {
    for (let m = start; m < distance + MAX_D; m += step) {
      const d0 = m - distance, d1 = d0 + len;
      if (d1 < -5) continue;
      const w0 = 5*sc(d0), w1 = 5*sc(d1);
      poly([
        [laneX(lb, d0)-w0, gy(d0)], [laneX(lb, d0)+w0, gy(d0)],
        [laneX(lb, d1)+w1, gy(d1)], [laneX(lb, d1)-w1, gy(d1)]
      ], '#f4f1de');
    }
  }
  // meio-fio
  for (const side of [-1, 1]) {
    poly([
      [W/2 + side*ROAD_HALF*sN, yN], [W/2 + side*(ROAD_HALF+10)*sN, yN],
      [W/2 + side*(ROAD_HALF+10)*0.001, HORIZON], [W/2 + side*ROAD_HALF*0.001, HORIZON]
    ], '#e9e4da');
  }
}

// ---------- Desenho: casas, postes e árvores ----------
const PALETTE = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#ff9f1c','#2ec4b6','#f15bb5'];
const BLOCK = 16;
function wall(side, d0, d1, h, color, kind, seed) {
  const F0 = d0, F1 = d1;
  d0 = Math.max(d0, -3);
  if (d1 <= d0) return;
  const s0 = sc(d0), s1 = sc(d1);
  const inner = ROAD_HALF + SIDEWALK*0.7;
  const x0 = W/2 + side*inner*s0, x1 = W/2 + side*inner*s1;
  const g0 = gy(d0), g1 = gy(d1);
  poly([[x0, g0], [x1, g1], [x1, g1 - h*s1], [x0, g0 - h*s0]], color);
  poly([[x0, g0 - h*s0], [x1, g1 - h*s1], [x1, g1 - h*s1 - 7*s1], [x0, g0 - h*s0 - 7*s0]], shade(color, -45));
  poly([[x0, g0], [x1, g1], [x1, g1 - 12*s1], [x0, g0 - 12*s0]], 'rgba(0,0,0,.18)');
  if (kind === 'casa') {
    const n = Math.max(1, Math.floor((F1-F0)/4));
    for (let i = 0; i < n; i++) {
      const dc = F0 + (i+0.5)*(F1-F0)/n, ha = dc - 0.8, hb = dc + 0.8;
      if (ha < -3) continue;
      const sa = sc(ha), sb = sc(hb);
      const xa = W/2 + side*inner*sa, xb = W/2 + side*inner*sb;
      const ba = gy(ha), bb = gy(hb);
      const y0 = h*0.5, y1 = h*0.78;
      poly([[xa, ba-y0*sa], [xb, bb-y0*sb], [xb, bb-y1*sb], [xa, ba-y1*sa]], i % 2 ? '#ffe9a8' : '#bde0fe');
    }
    // porta
    const dp = F0 + (F1-F0)*0.5, pa = dp - 0.7, pb = dp + 0.7;
    if (pa > -3) {
      const spa = sc(pa), spb = sc(pb);
      const xa = W/2 + side*inner*spa, xb = W/2 + side*inner*spb;
      poly([[xa, gy(pa)], [xb, gy(pb)], [xb, gy(pb)-50*spb], [xa, gy(pa)-50*spa]], shade(color, -80));
    }
  } else if (kind === 'muro') {
    // grafite colorido
    const n = 3;
    for (let i = 0; i < n; i++) {
      const dc = F0 + (i+0.5)*(F1-F0)/n, ha = dc - 1.1, hb = dc + 1.1;
      if (ha < -3) continue;
      const sa = sc(ha), sb = sc(hb);
      const xa = W/2 + side*inner*sa, xb = W/2 + side*inner*sb;
      const ba = gy(ha), bb = gy(hb);
      poly([[xa, ba-h*0.2*sa], [xb, bb-h*0.2*sb], [xb, bb-h*0.8*sb], [xa, ba-h*0.8*sa]], PALETTE[(seed + i*3) % 8]);
    }
  }
}
function drawPole(side, d) {
  if (d < -3 || d > MAX_D) return null;
  const s = sc(d), x = W/2 + side*(ROAD_HALF + SIDEWALK*0.32)*s, y = gy(d);
  ctx.strokeStyle = '#3d2b1f'; ctx.lineWidth = Math.max(1, 6*s);
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 200*s); ctx.stroke();
  ctx.lineWidth = Math.max(1, 4*s);
  ctx.beginPath(); ctx.moveTo(x - 26*s, y - 190*s); ctx.lineTo(x + 26*s, y - 190*s); ctx.stroke();
  return [x, y - 190*s];
}
function drawTree(side, d) {
  if (d < -3 || d > MAX_D) return;
  const s = sc(d), x = W/2 + side*(ROAD_HALF + SIDEWALK*0.5)*s, y = gy(d);
  ctx.fillStyle = '#6b4226'; ctx.fillRect(x - 5*s, y - 60*s, 10*s, 60*s);
  const g = ctx.createRadialGradient(x - 10*s, y - 100*s, 4*s, x, y - 90*s, 46*s);
  g.addColorStop(0, '#6fdc7a'); g.addColorStop(1, '#1f8a3a');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y - 90*s, 38*s, 0, Math.PI*2); ctx.fill();
}
function drawScenery() {
  const firstK = Math.floor(distance / BLOCK);
  const lastK = Math.ceil((distance + MAX_D) / BLOCK);
  // casas e muros: de longe pra perto
  for (let k = lastK; k >= firstK - 1; k--) {
    for (const side of [-1, 1]) {
      const r = hash(k*2 + (side > 0 ? 1 : 0));
      const base = k*BLOCK - distance;
      if (r < 0.14) { drawTree(side, base + 8); continue; }
      const color = PALETTE[Math.floor(hash(k*5 + side)*8)];
      const h = 100 + hash(k*7 + side)*90;
      const seed = ((k*2 + (side > 0 ? 1 : 0)) % 8 + 8) % 8;
      if (r < 0.30) wall(side, base + 1, base + BLOCK - 1, 70, color, 'muro', seed);
      else wall(side, base + 1, base + BLOCK - 1, h, color, 'casa', seed);
    }
  }
  // postes e fios
  const firstP = Math.floor(distance / 20);
  const lastP = Math.ceil((distance + MAX_D) / 20);
  for (const side of [-1, 1]) {
    let prev = null;
    for (let p = lastP; p >= firstP - 1; p--) {
      const top = drawPole(side, p*20 - distance);
      if (top && prev) {
        ctx.strokeStyle = 'rgba(30,30,30,.7)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(top[0], top[1]);
        ctx.quadraticCurveTo((top[0]+prev[0])/2, (top[1]+prev[1])/2 + 6, prev[0], prev[1]);
        ctx.stroke();
      }
      prev = top;
    }
  }
}

// ---------- Desenho: moedas, obstáculos, chegada e skatista ----------
function drawCoin(c) {
  if (c.taken) return;
  const d = c.d - distance;
  if (d < -2 || d > MAX_D) return;
  const s = sc(d), x = laneX(c.lane, d), y = gy(d) - 46*s, r = 15*s;
  const w = Math.max(0.2, Math.abs(Math.cos(time*4 + c.d))) * r;
  ctx.save();
  ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 10*s;
  const g = ctx.createRadialGradient(x - w*0.3, y - r*0.3, 1, x, y, r);
  g.addColorStop(0, '#fff6c8'); g.addColorStop(0.55, '#ffd23f'); g.addColorStop(1, '#b8860b');
  ctx.fillStyle = g; ctx.strokeStyle = '#8a6300'; ctx.lineWidth = Math.max(1, 2*s);
  ctx.beginPath(); ctx.ellipse(x, y, w, r, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawObstacle(o) {
  if (o.hit) return;
  const d = o.d - distance;
  if (d < -2 || d > MAX_D) return;
  const s = sc(d), x = laneX(o.lane, d), y = gy(d);

  if (o.type === 'cone') {
    // quase metade do tamanho do skatista, mas dá pra pular por cima
    const h = 88*s, w = 46*s;
    ctx.fillStyle = '#ff6a00';
    ctx.beginPath();
    ctx.moveTo(x, y - h);
    ctx.lineTo(x + w/2, y - 3*s);
    ctx.lineTo(x - w/2, y - 3*s);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#a83e00'; ctx.lineWidth = Math.max(1, 2*s); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - w*0.34, y - h*0.62, w*0.68, h*0.11);
    ctx.fillRect(x - w*0.26, y - h*0.32, w*0.52, h*0.1);
    ctx.fillStyle = '#8a3d00';
    ctx.fillRect(x - w*0.65, y - 5*s, w*1.3, 5*s);
  } else {
    // caminhão vermelho, visto de frente vindo reto na pista (como na
    // vida real): maior que o skatista, fica só na própria pista e não
    // dá pra passar de jeito nenhum (nem pulando).
    const w = 148*s, h = 172*s;
    const bodyW = w * 0.84;
    const bx = x - bodyW/2;

    // rodas dianteiras, uma de cada lado, aparecendo por baixo da carroceria
    ctx.fillStyle = '#161616';
    const wheelW = w*0.15, wheelH = h*0.24;
    ctx.fillRect(bx - wheelW*0.55, y - wheelH, wheelW, wheelH);
    ctx.fillRect(bx + bodyW - wheelW*0.45, y - wheelH, wheelW, wheelH);
    ctx.fillStyle = '#444';
    ctx.beginPath(); ctx.arc(bx, y - wheelH*0.5, wheelW*0.32, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx + bodyW, y - wheelH*0.5, wheelW*0.32, 0, Math.PI*2); ctx.fill();

    // frente da carroceria/cabine
    const g = ctx.createLinearGradient(bx, y - h, bx + bodyW, y);
    g.addColorStop(0, '#ff5a4d'); g.addColorStop(1, '#c81e1e');
    ctx.fillStyle = g;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, y - h, bodyW, h*0.88, 8*s);
    else ctx.rect(bx, y - h, bodyW, h*0.88);
    ctx.fill();
    ctx.strokeStyle = '#7a0f0f'; ctx.lineWidth = Math.max(1, 3*s); ctx.stroke();

    // para-choque
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(bx - w*0.03, y - h*0.16, bodyW + w*0.06, h*0.16);

    // grade do radiador
    ctx.fillStyle = '#242424';
    const gW = bodyW*0.46, gX = bx + (bodyW - gW)/2;
    ctx.fillRect(gX, y - h*0.44, gW, h*0.22);
    ctx.strokeStyle = '#555'; ctx.lineWidth = Math.max(1, 1.5*s);
    for (let i = 1; i < 5; i++) {
      const lx = gX + (gW/5)*i;
      ctx.beginPath(); ctx.moveTo(lx, y - h*0.44); ctx.lineTo(lx, y - h*0.22); ctx.stroke();
    }

    // faróis
    ctx.fillStyle = '#fff6c8';
    ctx.beginPath(); ctx.ellipse(bx + bodyW*0.14, y - h*0.32, w*0.045, h*0.05, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx + bodyW*0.86, y - h*0.32, w*0.045, h*0.05, 0, 0, Math.PI*2); ctx.fill();

    // para-brisa
    ctx.fillStyle = '#bfe8ff';
    ctx.fillRect(bx + bodyW*0.12, y - h*0.84, bodyW*0.76, h*0.26);
    ctx.strokeStyle = '#7a0f0f'; ctx.lineWidth = Math.max(1, 2*s);
    ctx.strokeRect(bx + bodyW*0.12, y - h*0.84, bodyW*0.76, h*0.26);
    ctx.beginPath(); ctx.moveTo(x, y - h*0.84); ctx.lineTo(x, y - h*0.58); ctx.stroke();

    // espelhos retrovisores
    ctx.fillStyle = '#7a0f0f';
    ctx.fillRect(bx - w*0.08, y - h*0.7, w*0.06, h*0.12);
    ctx.fillRect(bx + bodyW + w*0.02, y - h*0.7, w*0.06, h*0.12);

    // faixa de perigo amarelo/preto no para-choque
    ctx.save();
    ctx.beginPath(); ctx.rect(bx, y - h*0.16, bodyW, h*0.16); ctx.clip();
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(bx, y - h*0.16, bodyW, h*0.16);
    const stripe = 10*s;
    for (let sx = -h; sx < bodyW + h; sx += stripe*2) {
      poly([
        [bx+sx, y-h*0.06], [bx+sx+stripe, y-h*0.06],
        [bx+sx+stripe+h*0.16, y-h*0.16], [bx+sx+h*0.16, y-h*0.16]
      ], '#1a1a1a');
    }
    ctx.restore();
  }
}

// ---------- Desenho: meteoro, alvo de aviso e explosão ----------
function drawFallWarnings() {
  for (const f of fallEvents) {
    if (f.state !== 'aviso') continue;
    const lx = laneX(f.lane, 0);
    const p = f.timer / WARN_TIME; // 1 no início → 0 quando vai cair
    const pulso = 0.5 + 0.5 * Math.sin(time * 14);

    // brilho avermelhado no céu, de onde o meteoro está vindo
    ctx.save();
    ctx.globalAlpha = 0.5 * (1 - p);
    const skyGlow = ctx.createRadialGradient(lx, HORIZON - 10, 2, lx, HORIZON - 10, 40);
    skyGlow.addColorStop(0, '#ffb347'); skyGlow.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = skyGlow;
    ctx.beginPath(); ctx.arc(lx, HORIZON - 10, 40, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // alvo piscando NO CHÃO: anéis de mira encolhendo até o ponto de impacto
    ctx.save();
    ctx.translate(lx, BASE_Y + 4);
    ctx.globalAlpha = 0.55 + 0.35 * pulso;
    const r1 = 46 * p + 8, r2 = 28 * p + 5;
    ctx.strokeStyle = '#ff2d2d'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(0, 0, r1, r1 * 0.32, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, r2, r2 * 0.32, 0, 0, Math.PI * 2); ctx.stroke();
    // mira em cruz
    ctx.strokeStyle = '#ff2d2d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-r1 - 8, 0); ctx.lineTo(-r1 + 6, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r1 - 6, 0); ctx.lineTo(r1 + 8, 0); ctx.stroke();
    // mancha de perigo preenchendo o alvo
    ctx.globalAlpha = 0.25 + 0.15 * pulso;
    ctx.fillStyle = '#ff2d2d';
    ctx.beginPath(); ctx.ellipse(0, 0, r2 * 0.7, r2 * 0.22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // placa "!" piscando um pouco acima do alvo, sempre visível no chão
    if (Math.floor(time * 8) % 2 === 0) {
      ctx.save();
      ctx.translate(lx, BASE_Y - 46);
      ctx.fillStyle = '#ff2d2d';
      ctx.beginPath();
      ctx.moveTo(0, -26); ctx.lineTo(-15, 6); ctx.lineTo(15, 6);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#7a0000'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = `bold 16px 'Press Start 2P', monospace`;
      ctx.textAlign = 'center';
      ctx.fillText('!', 0, 1);
      ctx.textAlign = 'left';
      ctx.restore();
    }
  }
}

function drawFallObject(f) {
  const lx = laneX(f.lane, 0);

  if (f.state === 'caindo') {
    const p = 1 - f.timer / FALL_TIME; // 0 no alto → 1 no chão
    const topY = HORIZON - 6, groundY = BASE_Y - 6;
    const y = topY + (groundY - topY) * p;
    const size = 10 + 26 * p;

    // sombra no chão, ficando mais forte conforme o meteoro se aproxima
    ctx.save();
    ctx.globalAlpha = 0.2 + 0.45 * p;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(lx, BASE_Y + 6, 34 * p, 10 * p, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // rastro de fogo, esticado para cima (de onde ele veio)
    const trail = 30 + 90 * p;
    const tg = ctx.createLinearGradient(lx, y - trail, lx, y);
    tg.addColorStop(0, 'rgba(255,200,60,0)');
    tg.addColorStop(0.5, 'rgba(255,140,30,.55)');
    tg.addColorStop(1, 'rgba(255,230,120,.95)');
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.moveTo(lx - size*0.22, y);
    ctx.lineTo(lx + size*0.22, y);
    ctx.lineTo(lx + size*0.06, y - trail);
    ctx.lineTo(lx - size*0.06, y - trail);
    ctx.closePath(); ctx.fill();

    // faíscas soltando do rastro
    for (let i = 0; i < 5; i++) {
      const sp = hash(f.lane * 97 + i + Math.floor(time * 20));
      const sy = y - trail * (0.2 + sp * 0.7);
      const sx = lx + (sp - 0.5) * size * 0.9;
      ctx.save();
      ctx.globalAlpha = 0.6 * (1 - sp);
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath(); ctx.arc(sx, sy, 2 + 2 * (1 - sp), 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // brilho ao redor da rocha
    ctx.save();
    const glow = ctx.createRadialGradient(lx, y, size*0.1, lx, y, size*1.4);
    glow.addColorStop(0, 'rgba(255,200,90,.85)');
    glow.addColorStop(1, 'rgba(255,140,30,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(lx, y, size*1.4, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // núcleo rochoso, girando, com rachaduras incandescentes
    ctx.save();
    ctx.translate(lx, y);
    ctx.rotate(p * 5);
    ctx.fillStyle = '#4a4038';
    ctx.beginPath();
    ctx.moveTo(-size*0.5, -size*0.2);
    ctx.lineTo(-size*0.18, -size*0.55);
    ctx.lineTo(size*0.32, -size*0.42);
    ctx.lineTo(size*0.52, size*0.05);
    ctx.lineTo(size*0.18, size*0.52);
    ctx.lineTo(-size*0.34, size*0.4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#241d18'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = '#ffb347'; ctx.lineWidth = Math.max(1, size*0.06);
    ctx.beginPath(); ctx.moveTo(-size*0.3, -size*0.1); ctx.lineTo(0, size*0.05); ctx.lineTo(size*0.22, -size*0.15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-size*0.1, size*0.1); ctx.lineTo(size*0.15, size*0.3); ctx.stroke();
    ctx.restore();
  } else if (f.state === 'estrago') {
    const p = 1 - f.timer / SPLAT_TIME; // 0 no impacto → 1 no fim

    // cratera escura no chão (fica até o final, depois some com tudo)
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - p) * 0.9;
    ctx.fillStyle = '#241a14';
    ctx.beginPath(); ctx.ellipse(lx, BASE_Y - 2, 34, 10, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ff6a2e'; ctx.lineWidth = 2;
    ctx.globalAlpha = Math.max(0, 0.6 - p * 0.6);
    ctx.beginPath(); ctx.ellipse(lx, BASE_Y - 2, 34, 10, 0, 0, Math.PI*2); ctx.stroke();
    ctx.restore();

    // onda de choque se expandindo e sumindo
    ctx.save();
    ctx.globalAlpha = Math.max(0, 0.7 - p * 0.7);
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 3;
    const rw = 10 + p * 70;
    ctx.beginPath(); ctx.ellipse(lx, BASE_Y - 2, rw, rw * 0.3, 0, 0, Math.PI*2); ctx.stroke();
    ctx.restore();

    // labaredas subindo do centro, encolhendo com o tempo
    if (p < 0.6) {
      const fa = Math.max(0, 1 - p / 0.6);
      const flameH = 46 * fa;
      for (const [fx, fs] of [[-14, 0.8], [0, 1], [14, 0.75]]) {
        ctx.save();
        ctx.globalAlpha = fa;
        const fg = ctx.createLinearGradient(lx+fx, BASE_Y - flameH*fs, lx+fx, BASE_Y);
        fg.addColorStop(0, 'rgba(255,210,90,0)');
        fg.addColorStop(0.5, 'rgba(255,150,40,.9)');
        fg.addColorStop(1, 'rgba(255,60,20,.95)');
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.moveTo(lx+fx, BASE_Y);
        ctx.quadraticCurveTo(lx+fx - 8*fs, BASE_Y - flameH*fs*0.5, lx+fx, BASE_Y - flameH*fs);
        ctx.quadraticCurveTo(lx+fx + 8*fs, BASE_Y - flameH*fs*0.5, lx+fx, BASE_Y);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    // fumaça subindo e se dissipando
    for (let i = 0; i < 4; i++) {
      const sp = hash(f.lane * 53 + i);
      const rise = 14 + p * 60 * (0.6 + sp * 0.8);
      ctx.save();
      ctx.globalAlpha = Math.max(0, 0.4 - p * 0.4) * (0.5 + sp * 0.5);
      ctx.fillStyle = '#3a3a3a';
      ctx.beginPath();
      ctx.arc(lx + (sp - 0.5) * 40, BASE_Y - rise, 8 + p * 14, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // estilhaços de rocha voando e caindo
    for (const [ox, spd] of [[-18, 1], [12, 0.7], [-4, 1.3], [22, 0.9]]) {
      const fy = -30 * spd * (1 - p) + p * p * 40;
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - p);
      ctx.translate(lx + ox * (0.4 + p), BASE_Y - 6 + fy);
      ctx.rotate(p * 6);
      ctx.fillStyle = '#4a4038';
      ctx.fillRect(-4, -3, 8, 6);
      ctx.restore();
    }
  }
}

function drawFinish() {
  const d = TRACK_LENGTH - distance;
  if (d > MAX_D || d < -3) return;
  const s = sc(d), y = gy(d);
  const xl = W/2 - (ROAD_HALF + 20)*s, xr = W/2 + (ROAD_HALF + 20)*s;
  ctx.fillStyle = '#eee';
  ctx.fillRect(xl - 8*s, y - 230*s, 16*s, 230*s);
  ctx.fillRect(xr - 8*s, y - 230*s, 16*s, 230*s);
  const top = y - 230*s, bh = 46*s;
  const sq = 12*s;
  for (let i = 0; i * sq < xr - xl; i++) {
    for (let j = 0; j < 4; j++) {
      ctx.fillStyle = (i + j) % 2 ? '#111' : '#fff';
      ctx.fillRect(xl + i*sq, top + j*(bh/4), sq, bh/4);
    }
  }
  ctx.fillStyle = '#ff4d6d';
  ctx.font = `bold ${Math.max(6, 26*s)}px 'Press Start 2P', monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('CHEGADA', W/2, top + bh + 30*s);
  ctx.textAlign = 'left';
}

function drawPlayer() {
  const x = laneX(player.lane, 0);
  const jy = player.jumpY;
  const bob = player.onGround ? Math.sin(time*16) * 1.6 : 0;
  const lean = (player.targetLane - player.lane) * 0.28;
  const air = jy > 4;

  // sombra
  ctx.save();
  ctx.globalAlpha = Math.max(0.1, 0.32 - jy/650);
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(x, BASE_Y + 12, 48 - jy*0.1, 11 - jy*0.02, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(x, BASE_Y - jy + bob);
  ctx.rotate(lean);

  // skate (shape visto de trás)
  const deck = ctx.createLinearGradient(0, -20, 0, -6);
  deck.addColorStop(0, '#ff8fab'); deck.addColorStop(1, '#ff4d6d');
  ctx.fillStyle = deck; ctx.strokeStyle = '#7a1230'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-44, -20, 88, 13, 6); else ctx.rect(-44, -20, 88, 13);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.fillRect(-30, -16, 60, 3);
  ctx.fillStyle = '#222';
  for (const wx of [-32, 32]) { ctx.beginPath(); ctx.arc(wx, -3, 7, 0, Math.PI*2); ctx.fill(); }
  ctx.fillStyle = '#ddd';
  for (const wx of [-32, 32]) { ctx.beginPath(); ctx.arc(wx, -3, 2.6, 0, Math.PI*2); ctx.fill(); }

  // pernas (calça jeans) + tênis
  const knee = air ? 8 : 0;
  ctx.fillStyle = '#2f5d9e';
  ctx.fillRect(-25, -74 + knee, 16, 56 - knee);
  ctx.fillRect(9, -74 + knee, 16, 56 - knee);
  ctx.fillStyle = '#fff';
  ctx.fillRect(-28, -24, 21, 8); ctx.fillRect(7, -24, 21, 8);

  // camiseta
  const shirt = ctx.createLinearGradient(-30, -130, 30, -68);
  shirt.addColorStop(0, '#ff5a5a'); shirt.addColorStop(1, '#c81e3a');
  ctx.fillStyle = shirt;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-30, -132, 60, 64, 9); else ctx.rect(-30, -132, 60, 64);
  ctx.fill();

  // braços (equilíbrio)
  const swing = air ? -16 : Math.sin(time*9) * 5;
  ctx.strokeStyle = '#c68642'; ctx.lineWidth = 12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-28, -122); ctx.lineTo(-54, -96 + swing); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(28, -122); ctx.lineTo(54, -96 - swing); ctx.stroke();
  ctx.lineCap = 'butt';

  // mochila amarela
  const bag = ctx.createLinearGradient(-22, -126, 22, -82);
  bag.addColorStop(0, '#ffe066'); bag.addColorStop(1, '#f5b700');
  ctx.fillStyle = bag; ctx.strokeStyle = '#a87900'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-22, -124, 44, 44, 8); else ctx.rect(-22, -124, 44, 44);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#a87900'; ctx.fillRect(-10, -104, 20, 3);

  // cabeça + boné
  ctx.fillStyle = '#c68642';
  ctx.beginPath(); ctx.arc(0, -150, 17, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1f6feb';
  ctx.beginPath(); ctx.arc(0, -154, 18, Math.PI*1.02, Math.PI*1.98); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#174ea6'; ctx.fillRect(-18, -156, 36, 5);
  ctx.fillStyle = '#2b2118'; ctx.fillRect(-17, -148, 34, 9);

  ctx.restore();
}

// ---------- Desenho: tudo junto ----------
function draw() {
  ctx.save();
  // tremida de tela no impacto do meteoro
  if (shakeTimer > 0) {
    const mag = 7 * (shakeTimer / SHAKE_TIME);
    ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
  }

  drawSky();
  drawRoad();
  drawScenery();
  drawFallWarnings();
  drawFinish();

  // moedas e obstáculos juntos, dos mais longe pros mais perto
  const itens = [
    ...coins.filter(c => !c.taken).map(c => ({ d: c.d, tipo: 'moeda', ref: c })),
    ...obstacles.filter(o => !o.hit).map(o => ({ d: o.d, tipo: 'obstaculo', ref: o }))
  ].sort((a, b) => b.d - a.d);
  for (const item of itens) {
    if (item.tipo === 'moeda') drawCoin(item.ref); else drawObstacle(item.ref);
  }

  for (const f of fallEvents) drawFallObject(f);

  // enquanto invencível, o skatista pisca (some e aparece)
  if (!player.invincible || Math.floor(time * 12) % 2 === 0) drawPlayer();

  // flash de luz no instante do impacto
  if (flashTimer > 0) {
    ctx.save();
    ctx.globalAlpha = (flashTimer / FLASH_TIME) * 0.55;
    ctx.fillStyle = '#fff3d6';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  ctx.restore();
}

// ---------- Loop principal ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
